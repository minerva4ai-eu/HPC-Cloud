apiVersion: batch/v1
kind: Job

metadata:
  name: b17a-decision-engine
  namespace: <KUBERNETES_NAMESPACE>

  labels:
    app: cloud-hpc-decision-engine
    experiment: b1-7a-resource-decision

spec:
  backoffLimit: 0

  template:

    metadata:

      labels:
        app: cloud-hpc-decision-engine
        experiment: b1-7a-resource-decision

    spec:

      serviceAccountName: b17-decision-engine

      restartPolicy: Never

      containers:

        - name: decision-engine

          image: docker.io/library/python@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1

          command:
            - python3
            - /app/decision_engine.py

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:

            - name: decision-code
              mountPath: /app
              readOnly: true

            - name: workload-request
              mountPath: /request
              readOnly: true

      volumes:

        - name: decision-code

          configMap:
            name: b17-decision-engine-code

        - name: workload-request

          configMap:
            name: cloud-hpc-b17a-request
