apiVersion: v1
kind: ServiceAccount

metadata:
  name: b17-decision-engine
  namespace: <KUBERNETES_NAMESPACE>

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: cloud-hpc-b17-decision-readonly

rules:

  - apiGroups:
      - ""

    resources:
      - nodes
      - pods

    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: cloud-hpc-b17-decision-readonly

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-hpc-b17-decision-readonly

subjects:

  - kind: ServiceAccount
    name: b17-decision-engine
    namespace: <KUBERNETES_NAMESPACE>
