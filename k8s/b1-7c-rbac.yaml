apiVersion: v1
kind: ServiceAccount

metadata:
  name: b17c-controller
  namespace: <KUBERNETES_NAMESPACE>

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: cloud-hpc-b17c-controller-readonly

rules:

  - apiGroups:
      - ""

    resources:
      - nodes
      - pods

    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: cloud-hpc-b17c-controller-readonly

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-hpc-b17c-controller-readonly

subjects:

  - kind: ServiceAccount
    name: b17c-controller
    namespace: <KUBERNETES_NAMESPACE>

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: cloud-hpc-b17c-configmap-readonly
  namespace: <KUBERNETES_NAMESPACE>

rules:

  - apiGroups:
      - ""

    resources:
      - configmaps

    resourceNames:
      - cloud-hpc-b17c-request
      - cloud-hpc-workload-catalog

    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: cloud-hpc-b17c-configmap-readonly
  namespace: <KUBERNETES_NAMESPACE>

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-hpc-b17c-configmap-readonly

subjects:

  - kind: ServiceAccount
    name: b17c-controller
    namespace: <KUBERNETES_NAMESPACE>
